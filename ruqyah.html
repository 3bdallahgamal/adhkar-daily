<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الرُّقْيَةُ الشَّرْعِيَّةُ</title>
<link rel="stylesheet" href="style.css">
<style>
.ruqyah-page{min-height:100svh;padding:12px 14px 20px;background:#e9e1cf;color:#173c31;position:relative;overflow:hidden;display:flex;align-items:flex-start}
.ruqyah-page::before{content:"";position:absolute;inset:0;opacity:.22;background-image:radial-gradient(circle at center,transparent 0 42px,rgba(151,113,48,.18) 43px 44px,transparent 45px),radial-gradient(circle at center,transparent 0 20px,rgba(151,113,48,.12) 21px 22px,transparent 23px);background-size:84px 84px;transform:rotate(45deg);pointer-events:none}
.reader{width:min(720px,100%);margin:8px auto 0;position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center;color:#74817a;font-size:12px;margin-bottom:13px}.back{color:#9d7939;font-weight:700}
.header{text-align:center;margin-bottom:10px;min-height:88px;display:flex;flex-direction:column;justify-content:flex-start;align-items:center}.header h1{font-family:Amiri,serif;font-size:40px;line-height:1.05;margin:0;color:#173c31;font-weight:700}.shield-icon{font-size:30px;line-height:1;margin-top:7px;height:30px}
.nav{display:flex;align-items:center;gap:7px;margin:0 auto 8px;padding:4px 6px;background:rgba(247,241,226,.38);border:1px solid rgba(151,113,48,.12);border-radius:14px;max-width:420px}.nav-center{flex:1;min-width:0}.counter{text-align:center;color:#7c8781;font-size:10px;margin:0 0 4px}.progress-wrap{background:rgba(23,60,49,.10);border-radius:99px;height:3px;overflow:hidden;margin:0 2px}.progress{height:100%;width:0;background:#92703a;transition:.35s ease}.nav-arrow{width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:#967238;font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer;transition:.15s ease}.nav-arrow:active{transform:scale(.92)}.nav-arrow:disabled{opacity:.25;cursor:default}.nav-arrow:focus{outline:none}
.card{position:relative;background:#f7f1e2;border:2px solid rgba(151,113,48,.42);border-radius:120px 120px 24px 24px;padding:42px 30px 24px;box-shadow:0 18px 45px rgba(60,57,42,.13);text-align:center;overflow:hidden}
.card::before{content:"";position:absolute;top:14px;left:50%;transform:translateX(-50%);width:72px;height:18px;border-top:1px solid rgba(151,113,48,.55);border-bottom:1px solid rgba(151,113,48,.25);border-radius:50%}
.card::after{content:"✦";position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#a77d38;font-size:12px;background:#f7f1e2;padding:0 7px}
.zikr{font-family:Amiri,serif;font-size:clamp(24px,3.6vw,34px);line-height:1.85;color:#173c31;max-width:680px;margin:0 auto;text-wrap:balance;overflow-wrap:normal;word-break:normal}.zikr.long{font-size:clamp(21px,3.1vw,29px);line-height:1.8}.zikr.very-long{font-size:clamp(19px,2.8vw,26px);line-height:1.75}
.count-number{position:relative;border:0;background:#f7f1e2;font:700 34px Cairo;color:#173c31;cursor:pointer;display:flex;align-items:center;justify-content:center;width:92px;height:92px;padding:6px;margin:22px auto 10px;line-height:1;border-radius:50%;box-shadow:0 8px 20px rgba(60,57,42,.09),inset 0 0 0 1px rgba(151,113,48,.3);transition:transform .12s ease,box-shadow .12s ease}.count-number::before{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(#a77d38 var(--progress,0%),#dfe3d9 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));transition:background .2s ease}.count-number:active,.count-number.is-pressed{transform:scale(.94);outline:none;-webkit-tap-highlight-color:transparent}.count-number:focus{outline:none}.count-number span{font-size:15px;color:#89918d;font-weight:600}.count-number .counter-value{font-size:34px;color:#173c31;font-weight:700}
.fadhl{margin:18px auto 0;padding-top:13px;border-top:1px solid rgba(151,113,48,.18);max-width:620px}.fadhl-title{font-size:12px;color:#967238;font-weight:700;margin-bottom:4px}.fadhl-text{font-size:11px;line-height:1.8;color:#7a857f}
.done{display:none;text-align:center;padding:30px 20px}.done.show{display:block}.done h2{font-family:Amiri;font-size:38px;color:#173c31;margin:8px}.done p{color:#738079}.restart{display:inline-block;margin-top:8px;color:#967238;font-weight:700}
.card.fade-out{opacity:0;transform:translateY(8px)}.card.fade-in{animation:cardIn .3s ease}@keyframes cardIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.card.fade-in,.count-number.is-pressed{animation:none}}
@media(max-width:650px){.ruqyah-page{padding:10px 11px 18px}.top{margin-bottom:11px}.header{margin-bottom:8px}.header h1{font-size:36px}.card{padding:38px 17px 21px;border-radius:90px 90px 20px 20px}.zikr{font-size:25px;line-height:1.85}.count-number{font-size:34px}.nav{margin-bottom:7px;padding:3px 5px}.nav-arrow{width:28px;height:28px;font-size:22px}}
</style>
</head>
<body>
<main class="ruqyah-page">
<div class="reader">
<div class="top"><a class="back" href="index.html">← الرئيسية</a><span>قسم الرقية</span></div>
<div class="header"><h1>الرُّقْيَةُ الشَّرْعِيَّةُ</h1><div class="shield-icon" aria-hidden="true">🛡️</div></div>
<div class="nav" aria-label="التنقل بين أذكار الرقية">
<button class="nav-arrow" id="prevBtn" type="button" aria-label="الذكر السابق">‹</button>
<div class="nav-center"><div class="counter" id="counter"></div><div class="progress-wrap"><div class="progress" id="progress"></div></div></div>
<button class="nav-arrow" id="nextBtn" type="button" aria-label="الذكر التالي">›</button>
</div>
<article class="card" id="card">
<div class="zikr" id="zikr"></div>
<button class="count-number" id="countNumber" type="button" aria-label="تسجيل الذكر"><span class="counter-value">0</span> <span>/ 1</span></button>
<div class="fadhl" id="fadhl"><div class="fadhl-title">فضل الذكر</div><div class="fadhl-text" id="fadhlText"></div></div>
</article>
<section class="done" id="done"><div style="font-size:48px">🤍</div><h2>أحسنت</h2><p>أتممت الرقية. تقبّل الله منك وجعلها سببًا للسكينة والعافية.</p><a class="restart" href="index.html">العودة للرئيسية</a></section>
</div>
</main>
<script>
const data=[
["بِسْمِ اللَّهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ، اللَّهُ يَشْفِيكَ، بِسْمِ اللَّهِ أَرْقِيكَ.",1],
["بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.",3],
["بِسْمِ اللَّهِ يُبْرِئُنِي، وَمِنْ كُلِّ دَاءٍ يَشْفِينِي، وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ، وَشَرِّ كُلِّ ذِي عَيْنٍ.",1],
["بِسْمِ اللَّهِ (ثَلَاثًا)، أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ.",7],
["أَذْهِبِ الْبَأْسَ رَبَّ النَّاسِ، وَاشْفِ أَنْتَ الشَّافِيَ، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا.",1],
["أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ.",1],
["أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.",1],
["أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَنِي.",7]
];
let i=0,completed=0,total=0;
const zikr=document.getElementById("zikr"),countNumber=document.getElementById("countNumber"),counter=document.getElementById("counter"),progress=document.getElementById("progress"),card=document.getElementById("card"),done=document.getElementById("done"),prevBtn=document.getElementById("prevBtn"),nextBtn=document.getElementById("nextBtn"),fadhlText=document.getElementById("fadhlText");
const fadhl=[
"رقية ثابتة عن النبي ﷺ، وردت عن جبريل عليه السلام، وفيها سؤال الله الشفاء والاستعاذة من كل ما يؤذي ومن شر النفس أو عين الحاسد.",
"ذكر للتحصين، ورد فيه أن من قاله ثلاث مرات صباحًا ومساءً لم يضره شيء بإذن الله.",
"من ألفاظ الرقية، وفيه إسناد الشفاء إلى الله والاستعاذة به من أذى الحسد والعين.",
"ورد في الحديث أن النبي ﷺ أمر بقول «باسم الله» ثلاث مرات، ثم قول «أعوذ بالله وقدرته من شر ما أجد وأحاذر» سبع مرات عند وجود الألم.",
"دعاء نبوي في طلب الشفاء، وفيه سؤال الله وحده أن يذهب البأس وأن يمنح الشفاء الكامل.",
"دعاء للتحصين من الشيطان والهوام والعين، وهو من ألفاظ الرقية والاستعاذة بالله.",
"استعاذة بالله بكلماته التامات من شر ما خلق، وهي من ألفاظ التحصين.",
"دعاء بطلب الشفاء من الله، وفيه سؤال الله العظيم رب العرش العظيم أن يشفي المريض."
];
function updateCard(){total=data[i][1];completed=0;zikr.textContent=data[i][0];zikr.classList.remove("long","very-long");if(data[i][0].length>150)zikr.classList.add("very-long");else if(data[i][0].length>95)zikr.classList.add("long");countNumber.innerHTML='<span class="counter-value">0</span> <span>/ '+total+'</span>';countNumber.style.setProperty("--progress","0%");counter.textContent="الذكر "+(i+1)+" من "+data.length;fadhlText.textContent=fadhl[i]||"من أدعية الرقية والاستعاذة بالله.";progress.style.width=(data.length<=1?100:(i/(data.length-1))*100)+"%";prevBtn.disabled=i===0;nextBtn.disabled=i===data.length-1}
function render(){if(i>=data.length){card.style.display="none";document.querySelector(".nav").style.display="none";done.classList.add("show");return}card.style.display="block";document.querySelector(".nav").style.display="flex";done.classList.remove("show");updateCard();card.classList.remove("fade-in");void card.offsetWidth;card.classList.add("fade-in")}
prevBtn.onclick=()=>{if(i<=0)return;i--;render()};
nextBtn.onclick=()=>{if(i>=data.length-1)return;i++;render()};let touchStartX=0,touchStartY=0,touchStartTime=0;
card.addEventListener("touchstart",e=>{const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY;touchStartTime=Date.now()},{passive:true});
card.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(Date.now()-touchStartTime<600&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25){if(dx<0&&i<data.length-1){i++;render()}else if(dx>0&&i>0){i--;render()}}},{passive:true});

countNumber.onclick=()=>{if(completed>=total)return;completed++;countNumber.innerHTML='<span class="counter-value">'+completed+'</span> <span>/ '+total+'</span>';countNumber.style.setProperty("--progress",(completed/total*100)+"%");countNumber.classList.remove("is-pressed");void countNumber.offsetWidth;countNumber.classList.add("is-pressed");setTimeout(()=>countNumber.classList.remove("is-pressed"),180);if(completed===total){i++;card.classList.add("fade-out");setTimeout(()=>{card.classList.remove("fade-out");render()},220)}};
render();
</script>
</body>
</html>
