<script>
const surahs=[[1,'الفاتحة',7,'مكية'],[2,'البقرة',286,'مدنية'],[3,'آل عمران',200,'مدنية'],[4,'النساء',176,'مدنية'],[5,'المائدة',120,'مدنية'],[6,'الأنعام',165,'مكية'],[7,'الأعراف',206,'مكية'],[8,'الأنفال',75,'مدنية'],[9,'التوبة',129,'مدنية'],[10,'يونس',109,'مكية']];
const root=document.getElementById('surah-list');root.innerHTML=surahs.map(([n,name,ayah,type])=>'<a class="surah-row" href="quran.html?surah='+n+'"><span class="surah-number">'+String(n).padStart(2,'0')+'</span><span class="surah-name"><b>'+name+'</b><small>'+ayah+' آيات</small></span><span class="surah-type">'+type+'</span></a>').join('');
const params=new URLSearchParams(location.search),num=Number(params.get('surah'));if(num){const row=surahs.find(x=>x[0]===num)||surahs[0];document.getElementById('surah-list').hidden=true;document.querySelector('.quran-resume').hidden=true;document.querySelector('.quran-intro').hidden=true;document.querySelector('.quran-tabs').hidden=true;document.getElementById('quran-reading').hidden=false;document.getElementById('surah-title').textContent='سورة '+row[1];const box=document.getElementById('surah-text');const cache=localStorage.getItem('quran-surah-'+num);if(cache)box.textContent=cache;fetch('https://api.alquran.cloud/v1/surah/'+num).then(r=>r.json()).then(j=>{const text=j.data.ayahs.map(a=>a.text+' ۝'+a.numberInSurah).join(' ');box.textContent=text;localStorage.setItem('quran-surah-'+num,text)}).catch(()=>{if(!cache)box.textContent='تعذّر تحميل السورة. تحقق من اتصال الإنترنت ثم أعد المحاولة.'});document.getElementById('back-to-surahs').onclick=()=>location.href='quran.html';}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{}));
</script></body></html>
