<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8f5"><title>طمأنينة | القرآن</title><link rel="stylesheet" href="style.css?v=26"></head>
<body class="app-body"><header class="app-top"><a class="app-brand" href="index.html"><span class="brand-symbol">☾</span><b>طمأنينة</b></a><div class="top-actions"><a class="top-action" href="more.html">☰</a><a class="top-action" href="duas.html">⌕</a></div></header>
<main class="app-main quran-main"><a class="quran-resume" href="quran.html?surah=1"><span class="quran-motif">۞</span><span><small>آخر قراءة</small><b>الفاتحة</b><em>رقم السورة: ١</em></span><span class="resume-arrow">←</span></a><div class="section-heading"><h2>القرآن الكريم</h2><span>السور</span></div><div class="quran-tabs"><button class="selected">السور</button><button type="button">الأجزاء</button><button type="button">الصفحات</button></div><div class="surah-list" id="surah-list"></div><div class="quran-reading" id="quran-reading" hidden><button class="back-to-surahs" id="back-to-surahs">→ السور</button><h2 id="surah-title"></h2><div id="surah-text" class="surah-text">جاري تحميل السورة…</div></div><p class="page-note">يحتاج تحميل نص السورة اتصالًا بالإنترنت.</p></main>
<nav class="bottom-nav"><a href="tasbeeh.html"><span>◌</span>التسبيح</a><a href="qibla.html"><span>⌖</span>القبلة</a><a class="active" href="quran.html"><span>▤</span>القرآن</a><a href="index.html"><span>⌂</span>الرئيسية</a></nav>
<script>
const surahs=[[1,'الفاتحة',7,'مكية'],[2,'البقرة',286,'مدنية'],[3,'آل عمران',200,'مدنية'],[4,'النساء',176,'مدنية'],[5,'المائدة',120,'مدنية'],[6,'الأنعام',165,'مكية'],[7,'الأعراف',206,'مكية'],[8,'الأنفال',75,'مدنية'],[9,'التوبة',129,'مدنية'],[10,'يونس',109,'مكية']];
const root=document.getElementById('surah-list');root.innerHTML=surahs.map(([n,name,ayah,type])=>'<a class="surah-row" href="quran.html?surah='+n+'"><span class="surah-number">'+String(n).padStart(2,'0')+'</span><span class="surah-name"><b>'+name+'</b><small>'+ayah+' آيات</small></span><span class="surah-type">'+type+'</span></a>').join('');
const params=new URLSearchParams(location.search),num=Number(params.get('surah'));if(num){const row=surahs.find(x=>x[0]===num)||surahs[0];document.getElementById('surah-list').hidden=true;document.querySelector('.quran-resume').hidden=true;document.querySelector('.quran-main>.section-heading').hidden=true;document.querySelector('.quran-tabs').hidden=true;document.getElementById('quran-reading').hidden=false;document.getElementById('surah-title').textContent='سورة '+row[1];const box=document.getElementById('surah-text');const cache=localStorage.getItem('quran-surah-'+num);if(cache)box.textContent=cache;fetch('https://api.alquran.cloud/v1/surah/'+num).then(r=>r.json()).then(j=>{const text=j.data.ayahs.map(a=>a.text+' ۝'+a.numberInSurah).join(' ');box.textContent=text;localStorage.setItem('quran-surah-'+num,text)}).catch(()=>{if(!cache)box.textContent='تعذّر تحميل السورة. تحقق من اتصال الإنترنت ثم أعد المحاولة.'});document.getElementById('back-to-surahs').onclick=()=>location.href='quran.html';}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{}));
</script></body></html>
