<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الأذكار</title>
<link rel="stylesheet" href="style.css">
<style>
.adhkar-page{min-height:100svh;padding:16px 16px 24px;background:#f4efe2;color:#173c31;position:relative;overflow:hidden}
.adhkar-page::before{content:"";position:absolute;inset:0;background-image:linear-gradient(30deg,rgba(176,139,72,.035) 12%,transparent 12.5%,transparent 87%,rgba(176,139,72,.035) 87.5%,rgba(176,139,72,.035)),linear-gradient(150deg,rgba(176,139,72,.035) 12%,transparent 12.5%,transparent 87%,rgba(176,139,72,.035) 87.5%,rgba(176,139,72,.035));background-size:42px 72px;opacity:.9;pointer-events:none}
.adhkar-page::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:#dce7df;top:-190px;right:-150px;opacity:.5;pointer-events:none}
.reader{width:min(780px,100%);margin:auto;position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center;color:#77847d;font-size:12px;margin-bottom:19px}.back{color:#9d7939;font-weight:700}
.header{text-align:center;margin-bottom:14px}.header .icon{font-size:25px;line-height:1;margin-bottom:3px;filter:grayscale(.1)}.header h1{font-family:Amiri,serif;font-size:42px;line-height:1.05;margin:0;color:#173c31}.header p{display:none}
.progress-wrap{background:#d9e0da;border-radius:99px;height:4px;overflow:hidden;margin:0 8px 6px}.progress{height:100%;width:0;background:linear-gradient(90deg,#a77d38,#476f60);transition:.35s ease}
.counter{text-align:center;color:#7c8781;font-size:11px;margin-bottom:12px}
.card{position:relative;background:#fbf8ef;border:1px solid rgba(157,121,57,.25);border-radius:28px;padding:38px 28px 25px;box-shadow:0 16px 45px rgba(40,55,45,.09);text-align:center;transition:opacity .2s ease,transform .2s ease;overflow:hidden}
.card::before,.card::after{content:"";position:absolute;width:42px;height:42px;border:1px solid rgba(157,121,57,.3);pointer-events:none}.card::before{top:10px;right:10px;border-left:0;border-bottom:0;border-radius:0 15px 0 0}.card::after{bottom:10px;left:10px;border-right:0;border-top:0;border-radius:0 0 0 15px}
.card.fade-out{opacity:0;transform:translateY(8px)}.card.fade-in{animation:cardIn .3s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.zikr{font-family:Amiri,serif;font-size:clamp(25px,3.8vw,35px);line-height:1.9;color:#173c31;max-width:660px;margin:0 auto}
.progress-label{font-size:11px;color:#87918b;margin-top:18px}.count-number{font-size:38px;font-weight:700;color:#173c31;line-height:1.1;margin:4px 0 12px}.count-number span{font-size:17px;color:#89928d;font-weight:600}
.zikr-progress{height:7px;background:#e0e5df;border-radius:99px;overflow:hidden;max-width:430px;margin:0 auto 19px}.zikr-progress-fill{height:100%;width:0;background:linear-gradient(90deg,#a77d38,#476f60);border-radius:99px;transition:width .2s ease}
.tap{border:0;border-radius:16px;padding:14px 38px;background:#173c31;color:#fff;font:700 15px Cairo;cursor:pointer;box-shadow:0 6px 0 #0e2d25,0 12px 20px rgba(23,60,49,.13);transition:transform .1s ease,box-shadow .1s ease}.tap:active,.tap.is-pressed{transform:translateY(6px);box-shadow:0 1px 0 #0e2d25,0 4px 8px rgba(23,60,49,.12)}.tap.is-pressed{animation:buttonPress .18s ease-out}
@keyframes buttonPress{0%{transform:translateY(0) scale(1)}45%{transform:translateY(6px) scale(.985)}100%{transform:translateY(0) scale(1)}}
.done{display:none;text-align:center;padding:32px 20px}.done.show{display:block}.done h2{font-family:Amiri;font-size:38px;color:#173c31;margin:8px}.done p{color:#738079}.restart{display:inline-block;margin-top:8px;color:#9d7939;font-weight:700}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card.fade-in,.tap.is-pressed{animation:none}}
@media(max-width:650px){.adhkar-page{padding:13px 12px 22px}.top{margin-bottom:17px}.header{margin-bottom:12px}.header h1{font-size:38px}.card{padding:35px 18px 23px;border-radius:25px}.zikr{font-size:26px;line-height:1.9}.count-number{font-size:36px}.tap{width:min(100%,280px);padding:14px 28px}}
</style>
</head>
<body>
<main class="adhkar-page"><div class="reader">
<div class="top"><a class="back" href="index.html">← الرئيسية</a><span id="session"></span></div>
<div class="header"><div class="icon" id="icon">🌅</div><h1 id="title">أذكار الصباح</h1><p>خذ لحظتك… واقرأ بهدوء.</p></div>
<div class="progress-wrap"><div class="progress" id="progress"></div></div><div class="counter" id="counter"></div>
<article class="card" id="card">
<div class="zikr" id="zikr"></div>
<div class="progress-label">أنجزت</div>
<div class="count-number" id="countNumber">0 <span>/ 3</span></div>
<div class="zikr-progress"><div class="zikr-progress-fill" id="zikrProgress"></div></div>
<button class="tap" id="tap">اضغط للذكر</button>
</article>
<section class="done" id="done"><div style="font-size:48px">🤍</div><h2>أحسنت</h2><p>أتممت أذكارك. تقبّل الله منك، وجعل يومك مليئًا بالسكينة.</p><a class="restart" href="index.html">العودة للرئيسية</a></section>
</div></main>
<script>
const morning=[
["أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",1],["اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ.",1],["رَضِيتُ بِاللَّهِ رَبًّا، وَبِالإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا.",3],["اللَّهُمَّ إِنِّي أَسْأَلُكَ العَفْوَ وَالعَافِيَةَ فِي الدُّنْيَا وَالآخِرَةِ.",1],["بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ العَلِيمُ.",3],["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.",100],["آيَةُ الْكُرْسِيِّ — ﴿اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...﴾",1],["قُلْ هُوَ اللَّهُ أَحَدٌ، قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، قُلْ أَعُوذُ بِرَبِّ النَّاسِ.",3]];
const evening=[
["أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",1],["اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ.",1],["رَضِيتُ بِاللَّهِ رَبًّا، وَبِالإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا.",3],["بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ العَلِيمُ.",3],["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.",100],["آيَةُ الْكُرْسِيِّ — ﴿اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...﴾",1],["قُلْ هُوَ اللَّهُ أَحَدٌ، قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، قُلْ أَعُوذُ بِرَبِّ النَّاسِ.",3]];
const type=new URLSearchParams(location.search).get("type")==="evening"?"evening":"morning";const data=type==="evening"?evening:morning;let i=0,completed=0,total=0;
document.getElementById("title").textContent=type==="evening"?"أذكار المساء":"أذكار الصباح";document.getElementById("icon").textContent=type==="evening"?"🌙":"🌅";document.getElementById("session").textContent=type==="evening"?"جلسة المساء":"جلسة الصباح";
function updateCard(){total=data[i][1];completed=0;document.getElementById("zikr").textContent=data[i][0];document.getElementById("countNumber").innerHTML=completed+" <span>/ "+total+"</span>";document.getElementById("zikrProgress").style.width="0%";document.getElementById("counter").textContent="الذكر "+(i+1)+" من "+data.length;updateOverallProgress()}
function updateOverallProgress(){let before=0;for(let n=0;n<i;n++)before+=data[n][1];let current=completed;let all=data.reduce((sum,item)=>sum+item[1],0);document.getElementById("progress").style.width=((before+current)/all*100)+"%"}
function render(){if(i>=data.length){document.getElementById("card").style.display="none";document.getElementById("counter").style.display="none";document.getElementById("progress").style.width="100%";document.getElementById("done").classList.add("show");return}updateCard();const card=document.getElementById("card");card.classList.remove("fade-in");void card.offsetWidth;card.classList.add("fade-in")}
const tap=document.getElementById("tap"),countNumber=document.getElementById("countNumber"),zikrProgress=document.getElementById("zikrProgress");
tap.onclick=()=>{if(completed>=total)return;completed++;countNumber.innerHTML=completed+" <span>/ "+total+"</span>";zikrProgress.style.width=(completed/total*100)+"%";updateOverallProgress();tap.classList.remove("is-pressed");void tap.offsetWidth;tap.classList.add("is-pressed");setTimeout(()=>tap.classList.remove("is-pressed"),180);if(completed===total){i++;tap.classList.remove("is-pressed");document.getElementById("card").classList.add("fade-out");setTimeout(()=>{document.getElementById("card").classList.remove("fade-out");render()},220)}};render();
</script>
</body>
</html>
