<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الأذكار</title>
<link rel="stylesheet" href="style.css">
<style>
.adhkar-page{min-height:100svh;padding:12px 14px 20px;background:#e9e1cf;color:#173c31;position:relative;overflow:hidden;display:flex;align-items:flex-start}
.adhkar-page::before{content:"";position:absolute;inset:0;opacity:.22;background-image:radial-gradient(circle at center,transparent 0 42px,rgba(151,113,48,.18) 43px 44px,transparent 45px),radial-gradient(circle at center,transparent 0 20px,rgba(151,113,48,.12) 21px 22px,transparent 23px);background-size:84px 84px;transform:rotate(45deg);pointer-events:none}
.reader{width:min(720px,100%);margin:8px auto 0;position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center;color:#74817a;font-size:12px;margin-bottom:13px}.back{color:#9d7939;font-weight:700}
.header{text-align:center;margin-bottom:10px;min-height:88px;display:flex;flex-direction:column;justify-content:flex-start;align-items:center}.header .icon{display:block;width:58px;height:58px;border-radius:18px;overflow:hidden;margin:2px auto 6px;box-shadow:0 6px 16px rgba(60,57,42,.08);background-size:190px 199px!important;background-repeat:no-repeat}.header .icon.icon-evening{background-position:-25px 5px!important}.header .icon.icon-morning{background-position:-110px 5px!important}.header .icon.icon-sleep{background-position:-26px -59px!important}.mosque-icon{display:none}.header h1{font-family:Amiri,serif;font-size:40px;line-height:1.05;margin:0;color:#173c31;font-weight:700}
.adhkar-nav{display:flex;align-items:center;gap:7px;margin:0 auto 8px;padding:4px 6px;background:rgba(247,241,226,.38);border:1px solid rgba(151,113,48,.12);border-radius:14px;max-width:420px}.nav-center{flex:1;min-width:0}.counter{text-align:center;color:#7c8781;font-size:10px;margin:0 0 4px}.progress-wrap{background:rgba(23,60,49,.10);border-radius:99px;height:3px;overflow:hidden;margin:0 2px}.progress{height:100%;width:0;background:#92703a;transition:.35s ease}.nav-arrow{width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:#967238;font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer;transition:.15s ease}.nav-arrow:active{transform:scale(.92)}.nav-arrow:disabled{opacity:.25;cursor:default}.nav-arrow:focus{outline:none}
.card{position:relative;background:#f7f1e2;border:2px solid rgba(151,113,48,.42);border-radius:120px 120px 24px 24px;padding:42px 30px 24px;box-shadow:0 18px 45px rgba(60,57,42,.13);text-align:center;overflow:hidden;height:calc(100svh - 305px);min-height:560px;display:grid;grid-template-rows:minmax(0,1fr) 108px;align-items:center}
.card .zikr{position:absolute;top:120px;left:30px;right:30px;width:auto;height:calc(100% - 250px);min-height:0;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:0}
.card .zikr:not(.quran){top:100px}.fadhl-note{z-index:3;position:absolute;left:38px;right:38px;bottom:130px;height:42px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Cairo,Arial,sans-serif;font-size:10px;line-height:1.7;color:#8a918c;font-weight:400;opacity:.9;pointer-events:none}.counter-area{position:absolute;left:30px;right:30px;bottom:36px;height:82px;border-top:1px solid rgba(151,113,48,.18);padding-top:10px;display:flex;justify-content:center;align-items:flex-start}
.counter-area .count-number{flex:none;order:unset;margin:0}
@media(max-width:650px){.fadhl-note{left:20px;right:20px;bottom:122px;height:40px;font-size:9px}}
.card::before{content:"";position:absolute;top:14px;left:50%;transform:translateX(-50%);width:72px;height:18px;border-top:1px solid rgba(151,113,48,.55);border-bottom:1px solid rgba(151,113,48,.25);border-radius:50%}
.card::after{content:"✦";position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#a77d38;font-size:12px;background:#f7f1e2;padding:0 7px}
.upper-ornament{position:absolute;top:53px;left:30px;right:30px;height:48px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0}.geo-pattern{position:absolute;inset:6px 20%;opacity:.16;background-image:radial-gradient(circle at center,transparent 0 14px,rgba(151,113,48,.55) 15px 16px,transparent 17px),linear-gradient(45deg,transparent 47%,rgba(151,113,48,.38) 48% 52%,transparent 53%),linear-gradient(-45deg,transparent 47%,rgba(151,113,48,.38) 48% 52%,transparent 53%);background-size:34px 34px;border-radius:50%}.gold-accent{position:relative;display:flex;align-items:center;gap:9px;color:#a77d38;font-size:11px}.gold-accent span{display:block;width:42px;height:1px;background:linear-gradient(90deg,transparent,rgba(167,125,56,.55),transparent)}.gold-accent b{font-weight:400;font-size:13px;background:#f7f1e2;padding:0 3px}.mini-mihrab{position:absolute;bottom:0;font-family:Amiri,serif;font-size:32px;line-height:.7;color:rgba(151,113,48,.24);width:58px;height:28px;text-align:center;border:1px solid rgba(151,113,48,.20);border-bottom:0;border-radius:40px 40px 0 0;padding-top:3px;background:rgba(247,241,226,.18)}
.card.fade-out{opacity:0;transform:translateY(8px)}.card.fade-in{animation:cardIn .3s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.zikr{font-family:Amiri,serif;font-size:clamp(24px,3.6vw,34px);line-height:1.85;color:#173c31;max-width:680px;margin:0 auto;text-wrap:balance;overflow-wrap:normal;word-break:normal}.zikr.quran{flex-direction:column;justify-content:flex-start;padding-top:6px}.zikr.quran .istiadhah{font-size:.62em;color:#967238;margin-bottom:14px;font-weight:700;display:block;width:100%;text-align:center}.zikr.quran .quran-text{font-size:.96em;line-height:1.95;text-wrap:balance}.zikr.quran{max-width:690px}.zikr.long{font-size:clamp(21px,3.1vw,29px);line-height:1.8;text-wrap:balance}.zikr.very-long{font-size:clamp(19px,2.8vw,26px);line-height:1.75;text-wrap:balance}
.progress-label{font-size:11px;color:#7e8983;margin-top:14px}.count-number{position:relative;border:0;background:#f7f1e2;font:700 34px Cairo;color:#173c31;cursor:pointer;display:flex;align-items:center;justify-content:center;width:86px;height:86px;padding:5px;margin:18px auto 8px;line-height:1;border-radius:50%;box-shadow:0 8px 20px rgba(60,57,42,.09),inset 0 0 0 1px rgba(151,113,48,.3);transition:transform .12s ease,box-shadow .12s ease}.count-number::before{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(#a77d38 var(--progress,0%),#dfe3d9 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));transition:background .2s ease}.count-number:active,.count-number.is-pressed{transform:scale(.94);outline:none;-webkit-tap-highlight-color:transparent}.count-number:focus{outline:none}.count-number:focus-visible{outline:none}.count-number span{font-size:15px;color:#89918d;font-weight:600}.count-number .counter-value{font-size:34px;color:#173c31;font-weight:700}

.fadhl{margin:18px auto 0;padding-top:13px;border-top:1px solid rgba(151,113,48,.18);max-width:620px}.fadhl-title{font-size:12px;color:#967238;font-weight:700;margin-bottom:4px}.fadhl-text{font-size:11px;line-height:1.8;color:#7a857f}

.done{display:none;text-align:center;padding:30px 20px}.done.show{display:block}.done h2{font-family:Amiri;font-size:38px;color:#173c31;margin:8px}.done p{color:#738079}.restart{display:inline-block;margin-top:8px;color:#967238;font-weight:700}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card.fade-in,.count-number.is-pressed{animation:none}}
@media(max-width:650px){.adhkar-page{padding:10px 11px 18px}.top{margin-bottom:11px}.header{margin-bottom:8px}.header h1{font-size:36px}.card{padding:38px 17px 21px;border-radius:90px 90px 20px 20px;height:calc(100svh - 265px);min-height:500px}.card .zikr{top:105px;left:17px;right:17px;height:calc(100% - 220px)}.counter-area{left:17px;right:17px;bottom:42px;height:78px}.zikr{font-size:25px;line-height:1.85}.count-number{font-size:34px}.adhkar-nav{margin-bottom:7px;padding:3px 5px}.nav-arrow{width:28px;height:28px;font-size:22px}}
</style>
<style id="readerDarkFix">body.dark .adhkar-page,body.dark .duas-page,body.dark .ruqyah-page,body.dark .tasbeeh-page{background:#101914!important;color:#e9eee9!important}body.dark .adhkar-page .card,body.dark .ruqyah-page .card,body.dark .duas-page .dua-card,body.dark .tasbeeh-page .tasbeeh-card{background:#1b2923!important;color:#edf1eb!important}body.dark .adhkar-page .zikr,body.dark .ruqyah-page .zikr,body.dark .duas-page .dua-text,body.dark .tasbeeh-page .zikr-name{color:#edf1eb!important}body.dark .adhkar-page .header h1,body.dark .ruqyah-page .header h1,body.dark .duas-page .duas-header h1,body.dark .tasbeeh-page .tasbeeh-header h1{color:#eef1eb!important}body.dark .adhkar-page .fadhl-note,body.dark .ruqyah-page .fadhl-text,body.dark .tasbeeh-page .fadhl-text{color:#aebbb4!important}</style>

<script>
const morning=[
["أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ ﴿اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ، لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ، لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ، مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ، يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ، وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ، وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ، وَلَا يَؤُودُهُ حِفْظُهُمَا، وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾",1],
["قُلْ هُوَ اللَّهُ أَحَدٌ، اللَّهُ الصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ.",3],
["قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، مِنْ شَرِّ مَا خَلَقَ، وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ، وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ، وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ.",3],
["قُلْ أَعُوذُ بِرَبِّ النَّاسِ، مَلِكِ النَّاسِ، إِلَهِ النَّاسِ، مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ، الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ، مِنَ الْجِنَّةِ وَالنَّاسِ.",3],
["أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.",1],
["اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ.",1],
["اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.",1],
["اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ.",4],
["اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ.",1],
["اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ.",3],
["حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ.",7],
["اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي، اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي، اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي.",1],
["اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ.",1],
["بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.",3],
["رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا.",3],
["يَا حَيُّ يَا قَيُّومُ، بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِيَ كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.",1],
["أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذَا الْيَوْمِ: فَتْحَهُ وَنَصْرَهُ وَنُورَهُ وَبَرَكَتَهُ وَهُدَاهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهِ وَشَرِّ مَا بَعْدَهُ.",1],
["أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ، حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ.",1],
["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ.",100],
["لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",10],
["لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",100],
["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ: عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ.",3],
["اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا.",1],
["أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ.",100],
["اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ.",10]
