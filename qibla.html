<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f3"><title>طمأنينة | القبلة</title><link rel="stylesheet" href="style.css?v=44"></head>

<main class="app-main qibla-main"><div class="qibla-intro"><span class="kaaba-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-4 9 4v10l-9 4-9-4z"/><path d="m3 7 9 4 9-4M12 11v10"/><path d="M6 8.4h12"/></svg></span><h1>القبلة</h1><p>تحديد اتجاه القبلة بدقة</p></div><div class="qibla-compass" id="compass"><span class="cardinal north">ش</span><span class="cardinal east">ق</span><span class="cardinal south">ج</span><span class="cardinal west">غ</span><div class="needle" id="needle"></div><span class="compass-center"></span></div><div class="qibla-degree"><b id="bearing">١٣٦°</b><h1>اتجاه القبلة</h1><p id="qibla-caption">الاتجاه التقريبي من القاهرة</p></div><button class="qibla-locate" id="locate">⌖ حدّد اتجاه القبلة من موقعي</button><button class="qibla-sensor" id="sensor">فعّل بوصلة الهاتف</button><p class="page-note" id="qibla-note">اسمح بالوصول للموقع لتحديد اتجاه أدق. لا يُحفظ موقعك.</p></main>

<script>
let qibla=136,heading=0,located=false;const bearingEl=document.getElementById('bearing'),needle=document.getElementById('needle'),caption=document.getElementById('qibla-caption');const kaaba={lat:21.4225,lon:39.8262};function calc(lat,lon){const p1=lat*Math.PI/180,p2=kaaba.lat*Math.PI/180,dl=(kaaba.lon-lon)*Math.PI/180,y=Math.sin(dl),x=Math.cos(p1)*Math.tan(p2)-Math.sin(p1)*Math.cos(dl);return (Math.atan2(y,x)*180/Math.PI+360)%360}function paint(){bearingEl.textContent=Math.round(qibla).toLocaleString('ar-EG')+'°';needle.style.transform='rotate('+qibla+'deg)'}paint();document.getElementById('locate').onclick=()=>{if(!navigator.geolocation){document.getElementById('qibla-note').textContent='المتصفح لا يدعم تحديد الموقع.';return}navigator.geolocation.getCurrentPosition(pos=>{qibla=calc(pos.coords.latitude,pos.coords.longitude);located=true;caption.textContent='اتجاه القبلة من موقعك الحالي';document.getElementById('qibla-note').textContent='تم تحديد الاتجاه. موقعك لا يُحفظ.';paint()},()=>document.getElementById('qibla-note').textContent='لم يتم السماح بالموقع. يمكنك استخدام الاتجاه التقريبي للقاهرة.',{enableHighAccuracy:true,timeout:12000})};document.getElementById('sensor').onclick=async()=>{try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const ok=await DeviceOrientationEvent.requestPermission();if(ok!=='granted')throw 0}window.addEventListener('deviceorientationabsolute'in window?'deviceorientationabsolute':'deviceorientation',e=>{if(e.alpha==null)return;heading=e.webkitCompassHeading??360-e.alpha;needle.style.transform='rotate('+(qibla-heading)+'deg)'}) ;document.getElementById('qibla-note').textContent='حرّك الهاتف ببطء لتحديد الاتجاه.'}catch(e){document.getElementById('qibla-note').textContent='البوصلة غير متاحة على هذا الجهاز. يمكنك الاسترشاد بالاتجاه المعروض.'}};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{}));
</script></body></html>
