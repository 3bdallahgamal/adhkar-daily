<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الأدعية</title>
<link rel="stylesheet" href="style.css">
<style>
.duas-page{min-height:100svh;padding:12px 14px 20px;background:#e9e1cf;color:#173c31;position:relative;overflow:hidden;display:flex;align-items:flex-start}
.duas-page::before{content:"";position:absolute;inset:0;opacity:.22;background-image:radial-gradient(circle at center,transparent 0 42px,rgba(151,113,48,.18) 43px 44px,transparent 45px),radial-gradient(circle at center,transparent 0 20px,rgba(151,113,48,.12) 21px 22px,transparent 23px);background-size:84px 84px;transform:rotate(45deg);pointer-events:none}
.duas-reader{width:min(720px,100%);margin:8px auto 0;position:relative;z-index:1}
.duas-top{display:flex;justify-content:space-between;align-items:center;color:#74817a;font-size:12px;margin-bottom:13px}
.duas-top .back{color:#9d7939;font-weight:700}
.duas-header{text-align:center;margin-bottom:10px;min-height:76px;display:flex;flex-direction:column;justify-content:flex-start;align-items:center}
.duas-header h1{font-family:Amiri,serif;font-size:40px;line-height:1.05;margin:0;color:#173c31;font-weight:700}
.duas-header .mosque-icon{font-size:30px;line-height:1;margin-top:7px;height:30px}
.dua-progress{text-align:center;color:#7c8781;font-size:10px;margin:0 auto 8px;letter-spacing:.02em}.dua-progress-bar{width:min(420px,100%);height:3px;margin:0 auto 8px;background:rgba(23,60,49,.10);border-radius:99px;overflow:hidden}.dua-progress-fill{height:100%;width:0;background:#92703a;transition:.35s ease}
.dua-nav-area{position:absolute;left:30px;right:30px;bottom:28px;height:86px;display:flex;justify-content:center;align-items:center;gap:14px}
.dua-nav{position:relative;border:0;background:#f7f1e2;font:700 17px Cairo;color:#173c31;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;min-width:112px;height:56px;padding:5px 14px;line-height:1;border-radius:30px;box-shadow:0 8px 20px rgba(60,57,42,.09),inset 0 0 0 1px rgba(151,113,48,.3);transition:transform .12s ease,box-shadow .12s ease}
.dua-nav::before{content:"";position:absolute;inset:-6px;border-radius:36px;border:2px solid rgba(167,125,56,.22);transition:.2s ease}
.dua-nav:active{transform:scale(.94)}
.dua-nav:disabled{opacity:.35;cursor:default;transform:none}
.dua-card{position:relative;background:#f7f1e2;border:2px solid rgba(151,113,48,.42);border-radius:120px 120px 24px 24px;padding:48px 34px 38px;box-shadow:0 18px 45px rgba(60,57,42,.13);text-align:center;overflow:hidden;height:calc(100svh - 275px);min-height:560px;display:flex;align-items:center;justify-content:center}
.dua-card::before{content:"";position:absolute;top:14px;left:50%;transform:translateX(-50%);width:72px;height:18px;border-top:1px solid rgba(151,113,48,.55);border-bottom:1px solid rgba(151,113,48,.25);border-radius:50%}
.dua-card::after{content:"✦";position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#a77d38;font-size:12px;background:#f7f1e2;padding:0 7px}
.dua-text{font-family:Amiri,serif;font-size:clamp(24px,3.6vw,34px);line-height:1.9;color:#173c31;max-width:650px;margin:0 auto;text-wrap:balance;overflow-wrap:normal}
.dua-text.long{font-size:clamp(19px,2.8vw,26px);line-height:1.75}
.dua-text.very-long{font-size:clamp(15px,2.25vw,21px);line-height:1.65}
.dua-heading{display:block;font-size:.8em;color:#967238;margin-bottom:18px;font-weight:700}
.dua-fade-in{animation:duaIn .3s ease}
@keyframes duaIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:650px){
.duas-page{padding:10px 11px 18px}.duas-top{margin-bottom:11px}.duas-header{margin-bottom:12px}.duas-header h1{font-size:36px}
.dua-next-area{left:17px;right:17px;bottom:20px;height:78px}
.dua-next{width:108px;height:54px;font-size:17px}
.dua-card{padding:42px 18px 100px;border-radius:90px 90px 20px 20px;height:calc(100svh - 250px);min-height:500px}
.dua-text{font-size:25px;line-height:1.85}.dua-text.long{font-size:19px;line-height:1.7}.dua-text.very-long{font-size:16px;line-height:1.6}
}
</style>
<style id="readerDarkFix">body.dark .adhkar-page,body.dark .duas-page,body.dark .ruqyah-page,body.dark .tasbeeh-page{background:#101914!important;color:#e9eee9!important}body.dark .adhkar-page .card,body.dark .ruqyah-page .card,body.dark .duas-page .dua-card,body.dark .tasbeeh-page .tasbeeh-card{background:#1b2923!important;color:#edf1eb!important}body.dark .adhkar-page .zikr,body.dark .ruqyah-page .zikr,body.dark .duas-page .dua-text,body.dark .tasbeeh-page .zikr-name{color:#edf1eb!important}body.dark .adhkar-page .header h1,body.dark .ruqyah-page .header h1,body.dark .duas-page .duas-header h1,body.dark .tasbeeh-page .tasbeeh-header h1{color:#eef1eb!important}body.dark .adhkar-page .fadhl-note,body.dark .ruqyah-page .fadhl-text,body.dark .tasbeeh-page .fadhl-text{color:#aebbb4!important}</style></head>
<body><button class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع الليلي" type="button" onclick="document.body.classList.toggle('dark');localStorage.setItem('adhkar-theme',document.body.classList.contains('dark')?'dark':'light');this.textContent=document.body.classList.contains('dark')?'☀':'☾'">☾</button>
<main class="duas-page">
<div class="duas-reader">
<div class="duas-top"><a class="back" href="index.html">← الرئيسية</a><span>قسم الأدعية</span></div>
<div class="duas-header"><h1>الأدعية</h1><div class="mosque-icon" aria-hidden="true">🕌</div></div>
<div class="dua-progress" id="duaProgress"></div><div class="dua-progress-bar"><div class="dua-progress-fill" id="duaProgressFill"></div></div>
<article class="dua-card" id="card"><div class="dua-text" id="duaText"></div><div class="dua-nav-area"><button class="dua-nav dua-prev" id="prevBtn" type="button" aria-label="الدعاء السابق"><span>→</span> السابق</button><button class="dua-nav dua-next" id="nextBtn" type="button" aria-label="الدعاء التالي">التالي <span>←</span></button></div></article>
</div>
</main>
<script>
const duas=[
`اللهم اكتب لي وظيفة تكون لي سترًا في الدنيا وراحة للنفس وبابًا للحلال ومجالًا للعطاء. اللهم ارزقني وظيفة أحبها ويحبني أهلها، أبدع فيها وتبدع بي، وأنمو معها وتنمو بي، وتكون لي لا عليّ. اللهم يسّر لي القبول حيثما ذهبت، وقرّب لي الفرص الجميلة قبل أن أبحث عنها يا رب.`,
`اللهم لا طاقة لي بالجهد ولا قوة لي على البلاء، فلا تحرمني العافية والرزق ولا تكلني إلى خلقك، بل تفرّد لي بحاجتي وتولّني برحمتك، فإنك إن وكلتني إلى نفسي عجزت عنها، وإن وكلتني إلى خلقك ظلموني وحرَموني وقهروني. ومنّ عليّ بفضلك يا الله، أغنني وابسط لي واكفني، وخلّصني من حسدهم وحقدهم، واجعل رضاي فيما يرد عليّ منك، وبارك لي فيما رزقتني وفيما خوّلتني، واجعلني في كل حالاتي محفوظًا مجارًا، واقضِ عني كل ما عليّ لك في وجه من وجوه طاعتك أو ببلائك، فأنت تعلم عظم ضعفي وكثرة ذنوبي وضعف بدني وقوتي وغفلتي، فأدِّ ما همّني عندي، يا عظيم، فإنك واسع كريم.`,
`بسم الله توكلت على الله. يا رب أحتسب يومي هذا لوجهك الكريم فتقبّله مني، ويسّر لي أمري وارزقني وبارك لي فيه. أستودع الله الذي لا تضيع ودائعه ديني ونفسي وأمانتي وخواتيم عملي وأهلي وأحبتي وبيتي ومالي وجميع ما أنعم الله به عليّ.`,
`اللهم كما وهبت عبد الرحمن بن عوف ثراءً واسعًا وإيمانًا صادقًا وسخّرته لإنفاق ماله في رضاك، افتح عليّ فتحًا واسعًا، وصبّ عليّ الرزق صبًّا، وعفوًا وعافية.`,
`اللهم يا رب مكّنّي في الأرض وسخّر لي الأسباب، واجعل المال الحلال يأتيني من أبواب كثيرة ومصادر دخل عديدة، وعلّمني كيف أستعمله وأنفقه بالشكل الذي يرضيك عني، وسخّرني لأنفع به نفسي وأعمر به أرضك، وأعين به من تشاء من عبادك، وضاعفه لي أضعافًا كثيرة، واجعله مالًا مباركًا لا ينقص ولا ينقطع، بكرمك وجودك وقدرتك التي وسعت كل شيء.`,
`اللهم إني أسألك بأنك أنت الله لا إله إلا أنت، الأحد الصمد، الذي لم يلد ولم يولد ولم يكن له كفوًا أحد، أن تريني عجائب قدرتك على تيسير أموري. اللهم سخّر لي الأرض ومن عليها، والسماء ومن فيها، وعبادك الصالحين، وكل من وليته أمري.`,
`لا إله إلا الله العظيم الحليم، لا إله إلا الله رب العرش الكريم، لا إله إلا الله رب السماوات والأرض ورب العرش العظيم. يا رب يا كريم يا عظيم، قد همّني أمر عظيم، وكل عظيم عند العظيم هيّن. يا رب يا رب، كل دعوة توارت في أفئدة تنتظر أن تصبّ عليها القبول صبًّا صبًّا يا كريم. يا جبار برحمتك أستغيث، يا حي يا قيوم.`,
`اللهم إني لا أصلح للفقر، ولا يصلح الفقر لي. اللهم أغنني من فضلك. اللهم ارزقني مالًا أغني به نفسي، وأعزّ به ديني، وأعين به ذريتي، وأعاون به عائلتي والمحتاجين. اللهم افتح لي أبواب الرزق فتحًا طيبًا، واكتب لي اليسر بعد العسر، والغنى بعد الحاجة، والفرج بعد الصبر. اللهم صلّ وسلم على نبينا محمد عدد ما رزقت، وعدد ما أعطيت، وعدد ما في خزائنك من فضل لا ينفد. اللهم تقبّل دعائي، ولا تردّني خائبًا، واكتب لي رزقًا يسعد قلبي، ويقرّ عيني، ويجعلني أراك في كل نعمة أنعمت بها.`,
`يارب كن معي حين لا يكون لي أحد، وكن لي حين أكون غريبًا، وارزقني الحنان حين لا أجده، والأمان حين أخاف، والطمأنينة حين يضيق صدري. اللهم اجعل هذا الدعاء لي نورًا وسلامًا وشفاءً، وسبيلًا إليك لا ينقطع ما دامت أرواحنا تهفو إليك.`,
`اللهم إني أسألك باسمك العظيم أن ترفع قدري وتشرح صدري، وأن تجعل الجنة داري ومستقري، وأن تجعلني من عبادك الشاكرين الذاكرين.`,
`اللهم إني أعوذ بك من الفشل، وقلة التوفيق، ومن التعلق بذنوب تجلب الفقر، وتسبب الضيق، وأعوذ بك من البعد عنك، وإهمال طاعتك، وأعوذ بك يا الله من فقدان الشغف، وسعي يستنزف الجهد والوقت بلا جدوى، وحياة بلا هدف، وأعوذ بك من طول النية، وحرمان الوصول، ومن العسر بعد اليسر، اللهم أصلح حالنا ويسر أمورنا ولا تمنع عنا رحمتك يا الله..`,
`اللهم إني أسألك باسمك العظيم أن ترفع قدري وتشرح صدري، وأن تجعل الجنة داري ومستقري.`,
`اللهم إني أسألك باسمك العظيم أن تُسعد قلبي سعادة لا تغادر تفاصيل أيامي أبدًا.`,
`اللهم إني أسألك باسمك العظيم أن تُغنيني من فضلك وتيسر لي كل عسير، وأن تفتح لي أبواب الخير والرزق.`,
`اللهم إني أسألك باسمك العظيم أن تنير بصيرتي وتهديني إلى الحق والصواب، وأن تجعلني من عبادك الشاكرين الذاكرين.`,
`اللهم إني أسألك باسمك العظيم أن تحفظني من فواجع الأقدار، ومن كل عين حاسدة، ومن كل شر مستتر.`,
`اللهم إني أسألك باسمك العظيم أن تجبر كسري وتبدل حزني فرحًا، وهمي فرجًا، وعسري يسرًا.`,
`اللهم ارزقني عملًا صالحًا يغنيني عن سؤال الخلق، ويكفيني في أمر الدنيا، ويصلحني في أمر الآخرة. اللهم يا رحمن يا رحيم، يا ذا الجلال والإكرام، أسألك وظيفة طيبة تدر عليّ مالًا حلالًا طيبًا مباركًا فيه. اللهم يا كريم يا مالك الملك يا عزيزًا لا يضام، اللهم إن كان رزقي في السماء فأقره، وإن كان في الأرض فأخرجه، وإن كان بعيدًا فقربه، وإن كان صعبًا فسَهِّله، وإن كان عسيرًا فيسره. اللهم ما أصبح بي من نعمة أو بأحد من خلقك فمنك وحدك لا شريك لك، لك الحمد ولك الشكر. اللهم اكتب لي التوفيق والنجاح في كل خطوة. اللهم يسر لي الحصول على وظيفة طيبة مريحة ترضيني وتهدي قلبي. اللهم إذا احترت فسددني، وإذا سددت (ضللت) فاختر لي يا رب، فإني لا أحسن الاختيار. اللهم لا تجعل عيشي في الدنيا كدًا، ولا تجعل حياتي فيها نكدًا.`,
`رب هب لي، اللهم هب لي ملكًا وجاهًا، هب لي مالًا وآخر وهب لي تسخيرًا، وهب لي عونًا وقوة، وهب لي سعادة وما تمنيت، وسخر لي الأسباب والأشخاص والأماكن ولا تجعلني ضائعًا لا أملك جهة ولا بوصلة. يارب دلني ووجهني، يارب ارحمني وقوني بك وأغفر لي زلاتي وهفواتي يا رب. سخر لي من في السماء ومن هم على الأرض... يارب يا منان يا واسع أنت الكريم الوهاب، ارزقني أيام طيبة أعيش فيها بقلب آمن وروح ونفس ساكنة لا يملأني القلق ولا يؤرقني الخوف. هادئة.`,
`اللهم امنحني ثباتًا لا تهزه المواقف، وبصيرة تجعلني أعرف متى أتكلم ومتى أصمت، وقوة تحفظ كرامتي دون ظلم، وشجاعة تواجه خوفي دون تهور، وحكمة تجعل حضوري هادئًا وواثقًا، ولا تجعلني أسيرًا لرأي الناس، بل عبدًا يعرف قدره، ويستمد قوته من رضاه عنك وثقته بك.`,
`اللهم سخر لي في عملي هذا من يخافك ويرحمني، واجعل لي فيه قبولًا وتوفيقًا. اللهم ابعد عني شر الحاسدين والمكرين، وسخر لي جوارحي لطاعتك وإتقان عملي، واجعل رزقي حلالًا طيبًا مباركًا، وافتح لي فيه أبواب الترقية والخير.`,
`اللهم يا أكرم الأكرمين ويا أرحم الراحمين، يا من تسجد له الجبال وتسبح بحمده الأفواه، أسألك بأسمائك الحسنى وبصفاتك العظمى الذي إذا سُئلت بها أجبت حاجتك.`,
`اللهم بارك في عملي وسعيي، وقرب إليّ زيادة في راتبي تكون خيرًا لي، ووسع بها رزقي، وبارك في مالي، وألهم من بيده أمري تقدير جهدي، واجعل الزيادة تأتي بيسر وكرامة، وتكون سببًا لسعة العيش وراحة البال، ونفعًا لي ولمن أحب.`,
`عَوِّد نفسك كل صباح أن تقول: بسم الله الكافي، بسم الله الشافي، بسم الله المعافي، بسم الله الذي لا يضر مع اسمه أذى، بسم الله على نفسي وديني، بسم الله على أهلي ومالي، بسم الله على كل شيء أعطاني ربي. الله أكبر، الله أكبر، الله أكبر. أعوذ بالله مما أخاف وأحذر، الله ربي ولا أشرك به أحدًا، عز جارك، وجل ثناؤك، وتقدست أسماؤك ولا إله غيرك يا الله. بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم. أعوذ بالله مما أخاف وأحذر، الله ربي ولا أشرك به أحدًا، عز جارك، وجل ثناؤك، وتقدست أسماؤك ولا إله غيرك يا الله.`,
`اللهم إني استودعتك يومي فأرني فيه ما يسعدني ويسرني، وابعد عني ما يضرني، إنك على كل شيء قدير.`
];
let i=0;
const textEl=document.getElementById("duaText");
const card=document.getElementById("card");
function render(){
 textEl.className="dua-text";
 if(duas[i].length>500)textEl.classList.add("very-long");
 else if(duas[i].length>260)textEl.classList.add("long");
 textEl.textContent=duas[i];
 document.getElementById("duaProgress").textContent=`الدعاء ${i+1} من ${duas.length}`;
 document.getElementById("duaProgressFill").style.width=`${((i+1)/duas.length)*100}%`;
 card.classList.remove("dua-fade-in");void card.offsetWidth;card.classList.add("dua-fade-in");
 document.getElementById("nextBtn").disabled=i===duas.length-1;
 document.getElementById("nextBtn").innerHTML=i===duas.length-1?'تمّ <span>✓</span>':'التالي <span>←</span>';
}
document.getElementById("nextBtn").onclick=()=>{if(i<duas.length-1){i++;render()}};let touchStartX=0,touchStartY=0,touchStartTime=0;
card.addEventListener("touchstart",e=>{const t=e.changedTouches[0];touchStartX=t.clientX;touchStartY=t.clientY;touchStartTime=Date.now()},{passive:true});
card.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY;if(Date.now()-touchStartTime<600&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25){if(dx<0&&i<duas.length-1){i++;render()}else if(dx>0&&i>0){i--;render()}}},{passive:true});

render();
</script>
<script>if(localStorage.getItem("adhkar-theme")==="dark"){document.body.classList.add("dark");document.getElementById("themeToggle").textContent="☀"}</script></body>
</html>
