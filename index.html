<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أذكاري اليومية</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#173c31">
<link rel="icon" href="app-icon.svg">
</head>
<body><button class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع الليلي" type="button" onclick="document.body.classList.toggle('dark');localStorage.setItem('adhkar-theme',document.body.classList.contains('dark')?'dark':'light');this.textContent=document.body.classList.contains('dark')?'☀':'☾'">☾</button>
<main class="home">
  <div class="glow glow-one"></div><div class="glow glow-two"></div>
  <section class="hero">
    <div class="brand">✦ أذكاري اليومية</div>
    <div class="ornament">﷽</div>
    <h1>وردك اليوم <span>بذكر الله</span></h1>
    <p>اختر ما يناسب وقتك وابدأ لحظتك مع الذكر.</p>

    <div class="section-title">أذكار اليوم</div>
    <div class="choices">
      <a class="choice morning" href="adhkar.html?type=morning">
        <img class="choice-card-image" src="assets/morning_card.png" alt="" aria-hidden="true" loading="lazy">
      </a>
      <a class="choice evening" href="adhkar.html?type=evening">
        <img class="choice-card-image" src="assets/evening_card.png" alt="" aria-hidden="true" loading="lazy">
      </a>
    </div>

    <div class="section-title secondary-title">المزيد من الذكر</div>
    <div class="choices extra-choices">
      <a class="choice sleep" href="adhkar.html?type=sleep">
        <img class="choice-card-image" src="assets/sleep_card.png" alt="" aria-hidden="true" loading="lazy">
      </a>
      <a class="choice dua-choice" href="duas.html">
        <img class="choice-card-image" src="assets/dua_card.png" alt="" aria-hidden="true" loading="lazy">
      </a>
      <a class="choice tasbeeh-choice" href="tasbeeh.html">
        <img class="choice-card-image" src="assets/tasbeeh_card.png" alt="" aria-hidden="true" loading="lazy">
      </a>
      <a class="choice ruqyah-choice" href="ruqyah.html">
        <img class="choice-card-image" src="assets/ruqyah_card.png" alt="" aria-hidden="true" loading="lazy">
      </a>
    </div>

    <div class="quote">﴿ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ ﴾</div>
  </section>
</main>
<script>if(localStorage.getItem("adhkar-theme")==="dark"){document.body.classList.add("dark");document.getElementById("themeToggle").textContent="☀"}</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body>
</html>
