<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المسبحة الإلكترونية | أذكاري اليومية</title>
<link rel="stylesheet" href="style.css">
<style>
.tasbeeh-page{min-height:100svh;padding:24px 16px 40px;background:radial-gradient(circle at 50% 18%,#fffdf6 0,#f5f0e5 48%,#e9e1cf 100%)}
.tasbeeh-wrap{width:min(620px,100%);margin:auto}
.tasbeeh-top{display:flex;justify-content:space-between;align-items:center;color:#718079;font-size:13px;margin-bottom:28px}
.tasbeeh-top a{color:#a77d38;font-weight:700}
.tasbeeh-header{text-align:center}
.tasbeeh-icon{font-size:40px}
.tasbeeh-header h1{font-size:44px;margin:5px 0;color:#183d32}
.tasbeeh-header p{margin:0;color:#77857f;font-size:14px}
.tasbeeh-card{margin-top:25px;background:rgba(255,255,255,.82);border:1px solid rgba(24,61,50,.12);border-radius:30px;padding:28px 22px;box-shadow:0 20px 55px rgba(36,58,49,.09);text-align:center}.dhikr-list{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:8px;scrollbar-width:thin}.dhikr-option{flex:0 0 auto;border:1px solid rgba(24,61,50,.12);background:#f7f1e2;color:#5f7169;border-radius:16px;padding:9px 12px;font:600 12px Cairo;cursor:pointer}.dhikr-option.active{background:#e5ece7;color:#183d32;border-color:rgba(167,125,56,.38)}.dhikr-target{font-size:11px;color:#8a938e;margin-top:2px}
.zikr-name{font-family:Amiri,serif;font-size:32px;color:#173c31;line-height:1.7}
.count{font-family:Amiri,serif;font-size:70px;line-height:1;color:#a77d38;margin:20px 0 5px}
.target{color:#7a867f;font-size:13px}
.tap-circle{width:180px;height:180px;border-radius:50%;border:10px solid #dfe7e2;background:#183d32;color:#fff;font:700 21px Cairo;cursor:pointer;margin:25px auto 18px;display:grid;place-items:center;box-shadow:0 14px 30px rgba(24,61,50,.2);transition:.12s}
.tap-circle:active{transform:scale(.95)}
.reset{border:0;background:none;color:#a77d38;font:600 13px Cairo;cursor:pointer}
.done-message{display:none;color:#527d6c;font-weight:700;margin-top:8px}
.done-message.show{display:block}
@media(max-width:650px){
 .tasbeeh-page{padding:18px 13px 30px}
 .tasbeeh-header h1{font-size:39px}
 .tasbeeh-card{padding:27px 18px;border-radius:24px}
 .zikr-name{font-size:29px}
 .tap-circle{width:165px;height:165px}
}
</style>
</head>
<body>
<main class="tasbeeh-page">
<section class="tasbeeh-wrap">
<div class="tasbeeh-top"><a href="index.html">← الرئيسية</a><span>✦ أذكاري اليومية</span></div>
<div class="tasbeeh-header">
<div class="tasbeeh-icon">📿</div>
<h1>المسبحة الإلكترونية</h1>
<p>سبّح واذكر الله في أي وقت.</p>
</div>
<div class="tasbeeh-card">
<div class="dhikr-list" id="dhikrList"></div>
<div class="zikr-name" id="zikrName">سُبْحَانَ اللَّهِ وَبِحَمْدِهِ</div>
<div class="count" id="count">0</div>
<div class="target">من 100</div>
<button class="tap-circle" id="tap">اضغط</button>
<button class="reset" id="reset">إعادة العداد</button>
<div class="done-message" id="done">🤍 أحسنت، أتممت 100 تسبيحة</div>
</div>
</section>
</main>
<script>
const dhikrs=[
 {text:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",target:100},
 {text:"سُبْحَانَ اللَّهِ",target:100},
 {text:"الْحَمْدُ لِلَّهِ",target:100},
 {text:"اللَّهُ أَكْبَرُ",target:100},
 {text:"لَا إِلَهَ إِلَّا اللَّهُ",target:100},
 {text:"سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَاللَّهُ أَكْبَرُ",target:33},
 {text:"لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ",target:100},
 {text:"أَسْتَغْفِرُ اللَّهَ",target:100},
 {text:"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ",target:100}
];
let selected=0,count=0;
const countEl=document.getElementById("count"),done=document.getElementById("done"),list=document.getElementById("dhikrList"),nameEl=document.getElementById("zikrName"),targetEl=document.querySelector(".target");
function renderDhikr(){list.innerHTML=dhikrs.map((d,i)=>'<button class="dhikr-option '+(i===selected?"active":"")+'" data-i="'+i+'">'+d.text+'</button>').join("");nameEl.textContent=dhikrs[selected].text;targetEl.textContent="من "+dhikrs[selected].target;count=0;countEl.textContent=0;done.classList.remove("show");list.querySelectorAll(".dhikr-option").forEach(b=>b.onclick=()=>{selected=Number(b.dataset.i);renderDhikr()})}
document.getElementById("tap").onclick=()=>{const target=dhikrs[selected].target;if(count<target) count++;countEl.textContent=count;if(count===target) done.textContent="🤍 أحسنت، أتممت "+target+" تسبيحة";if(count===target) done.classList.add("show")};
document.getElementById("reset").onclick=()=>{count=0;countEl.textContent=0;done.classList.remove("show")};
renderDhikr();
</script>
</body>
</html>
